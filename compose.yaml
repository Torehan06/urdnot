# Week 3: urdnot-api with its real backends, Postgres and Redis.
#
#   cp .env.example .env    # then fill in real values
#   docker compose up -d --build
#   curl -fsS localhost:8000/readyz
#
# Secrets come from the git-ignored .env file in this directory, which Compose
# reads automatically for ${...} interpolation. Nothing secret is written here.

name: urdnot

services:
  api:
    build:
      context: .
      args:
        VERSION: 0.1.0
        REVISION: ${REVISION:-unknown}
    image: urdnot-api:0.1.0
    environment:
      # Service names are DNS names on the Compose network. Inside the api
      # container, "localhost" is the api container itself.
      DATABASE_URL: postgresql://urdnot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/urdnot
      REDIS_URL: redis://redis:6379/0
      CLAN_SECRET: ${CLAN_SECRET:?set CLAN_SECRET in .env}
      CLAN_NAME: ${CLAN_NAME:-Urdnot}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Loopback only: reachable from this machine, not from the LAN.
    ports:
      - "127.0.0.1:8000:8000"
    # A convenience, not a correctness requirement: the app starts without
    # Postgres and retries. This only avoids a burst of 503s on a cold start.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image's HEALTHCHECK (/healthz, liveness) is kept as is. Readiness
    # (/readyz) must never drive restarts: a Postgres outage is not a dead app.
    restart: on-failure
    # Matches Week 1's TimeoutStopSec and covers a 10 s /api/charge.
    stop_grace_period: 30s

  postgres:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: urdnot
      POSTGRES_DB: urdnot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18 images keep PGDATA at /var/lib/postgresql/18/docker and
      # declare the volume one level up. Mounting the old .../data path would
      # leave the real data in an anonymous volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP, not the Unix socket: during first-boot init the entrypoint runs a
      # socket-only temporary server, which would look ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: on-failure
    # No ports: only services on this Compose network can reach Postgres.

  redis:
    image: redis:8.10.2-trixie@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    volumes:
      # The default RDB snapshot is written to /data, including on shutdown,
      # so the headbutt counter survives `docker compose down` and `up`.
      - redisdata:/data
    healthcheck:
      # redis-cli exits 0 even on an error reply, so check for PONG explicitly.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s
    restart: on-failure
    # No ports, and no AUTH: Redis is reachable only on the Compose network.

volumes:
  pgdata:
  redisdata:

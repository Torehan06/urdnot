# Week 4: keep pinned versions current with small, reviewable PRs.
# Every Dependabot PR runs the ci workflow, so an update that breaks the tests
# or the Compose smoke test shows up as a red check before it is merged.

version: 2
updates:
  # SHA-pinned actions in .github/workflows/. Dependabot updates the SHA and
  # the "# vX.Y.Z" comment next to it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Exact == pins in app/requirements.txt and app/requirements-dev.txt.
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # postgres and redis tags + digests in compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

# urdnot-api: Service, Deployment, PodDisruptionBudget and (Week 9)
# HorizontalPodAutoscaler. The first three are the objects from
# infra/week5/api.yaml with the Week 6 patch applied; the design reasons are in
# docs/week-05.md, docs/week-06.md and docs/week-09.md.
apiVersion: v1
kind: Service
metadata:
  name: urdnot-api
  labels:
    app.kubernetes.io/name: urdnot-api
    app.kubernetes.io/component: api
    {{- include "urdnot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: urdnot-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urdnot-api
  labels:
    app.kubernetes.io/name: urdnot-api
    app.kubernetes.io/component: api
    {{- include "urdnot.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  {{- /* With autoscaling the field is left out on purpose: the
  HorizontalPodAutoscaler owns the replica count. A number here would reset
  it on every `helm upgrade`, also in the middle of a load peak. */}}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: urdnot-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urdnot-api
        app.kubernetes.io/component: api
      annotations:
        # Env vars are fixed when a container starts. This hash changes when
        # the ConfigMap's contents change, which changes the Pod template, so
        # the Deployment rolls out new Pods with the new values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: urdnot-api
      containers:
        - name: api
          image: {{ include "urdnot.apiImage" . }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: urdnot-config
          env:
            - name: CLAN_SECRET_FILE
              value: /etc/urdnot/secrets/clan-secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "urdnot.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://urdnot:$(POSTGRES_PASSWORD)@postgres:5432/urdnot
            - name: REDIS_URL
              value: redis://redis:6379/0
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: clan-secret
              mountPath: /etc/urdnot/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: clan-secret
          secret:
            secretName: {{ include "urdnot.secretName" . }}
            defaultMode: 0440
            items:
              - key: CLAN_SECRET
                path: clan-secret
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- if gt (include "urdnot.apiMinReplicas" . | int) 1 }}
---
# Only with 2+ replicas (the autoscaler's minimum counts): with one replica,
# minAvailable 1 would forbid every voluntary eviction and block a node drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: urdnot-api
  labels:
    app.kubernetes.io/name: urdnot-api
    app.kubernetes.io/component: api
    {{- include "urdnot.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: urdnot-api
{{- end }}
{{- with .Values.api.autoscaling }}
{{- if .enabled }}
---
# Week 9. Every 15 seconds the HPA controller reads the Pods' CPU usage from
# the metrics API (metrics-server) and computes
#
#   desired = ceil(current replicas * average utilization / target)
#
# Utilization is usage divided by the container's CPU *request*, not its
# limit: api.resources.requests.cpu and the target below belong together.
# Without metrics-server the HPA still keeps minReplicas but can't scale.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: urdnot-api
  labels:
    app.kubernetes.io/name: urdnot-api
    app.kubernetes.io/component: api
    {{- include "urdnot.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: urdnot-api
  minReplicas: {{ .minReplicas }}
  maxReplicas: {{ required "api.autoscaling.maxReplicas is required" .maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .targetCPUUtilizationPercentage }}
  behavior:
    # Up: act on the newest reading. Kubernetes' default policy applies
    # (at most double the Pods, or +4, per 15 seconds).
    scaleUp:
      stabilizationWindowSeconds: 0
    # Down: use the highest recommendation of the last N seconds, so a short
    # dip in load doesn't remove Pods that are needed again a minute later.
    # Then remove at most one Pod per minute.
    scaleDown:
      stabilizationWindowSeconds: {{ .scaleDownStabilizationSeconds }}
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}
{{- end }}

{{- /*
Created only when no existing Secret is named. `required` stops the install
with a clear message instead of deploying an empty secret, which the app would
treat as "no secret set". The fixed name lets the kubelet update the mounted
clan-secret file in place after `helm upgrade` (Week 6).
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: urdnot-secrets
  labels:
    {{- include "urdnot.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required (see infra/week7/values-local.yaml.example)" .Values.secrets.postgresPassword | quote }}
  CLAN_SECRET: {{ required "secrets.clanSecret is required (see infra/week7/values-local.yaml.example)" .Values.secrets.clanSecret | quote }}
{{- end }}

# Week 7: staging environment. Only the differences from urdnot/values.yaml.
# Staging should look like production, so it keeps the chart's defaults
# (2 replicas, info logging) and changes only what names the environment.
#
#   helm upgrade --install urdnot infra/week7/urdnot -n urdnot-staging --create-namespace \
#     -f infra/week7/values-staging.yaml -f infra/week7/values-local.yaml

api:
  # Week 9: the autoscaler sets the number of Pods (2 to 5) from CPU usage.
  # replicaCount is ignored while it is on.
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
  config:
    clanName: Urdnot (staging)
    logLevel: info

ingress:
  host: staging.urdnot.localhost
